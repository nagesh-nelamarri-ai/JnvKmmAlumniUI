<!-- Implement a Hosting Members section and Alumni Association Members section. fetch data from a Json file-->

<div class="member-section">
  <h2 class="alumni-header">Alumni Association Members <p-badge [value]="alumniMembers.length" severity="success" badgeSize="large"></p-badge></h2>
  <div class="scroll-container">
    <p-card *ngFor="let member of alumniMembers" class="member-card" >
      <img [src]="member.image" alt="{{member.name}}" class="member-image profile-photo">
      <div class="member-info">
        <h4>{{member.name}}</h4>
        <p>Batch of {{member.year}} - {{member.toYear}}</p>
      </div>
    </p-card>
  </div>
</div>

<div class="member-section">
  <h2 class="alumni-header">Hosting Batch Members <p-badge [value]="allMembers.length" severity="success" badgeSize="large" style="margin-left: 10px;"></p-badge></h2>
  <div class="scroll-container">
    <p-card *ngFor="let member of alumniMembers" class="member-card" >
      <img [src]="member.image" alt="{{member.name}}" class="member-image profile-photo">
      <div class="member-info">
        <h4>{{member.name}}</h4>
        <p>Batch of {{member.year}} - {{member.toYear}}</p>
      </div>
    </p-card>
  </div>
</div>
